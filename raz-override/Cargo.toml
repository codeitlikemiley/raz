[package]
name = "raz-override"
version = "0.2.2"
edition = "2024"
authors = ["raz contributors"]
description = "Override management system for raz with stable key generation"
repository = "https://github.com/raz-rs/raz"
license = "MIT OR Apache-2.0"

[dependencies]
raz-common = { path = "../raz-common", version = "0.2.2" }
raz-config = { path = "../raz-config", version = "0.2.2" }
raz-validation = { path = "../raz-validation", version = "0.2.2" }
serde = { workspace = true }
serde_json = { workspace = true }
tree-sitter = { workspace = true }
tree-sitter-rust = { workspace = true }
thiserror = { workspace = true }
tracing = "0.1"
indexmap = { workspace = true }
regex = { workspace = true }
sha2 = "0.10"
base64 = "0.22"
hex = "0.4"
chrono = { workspace = true }
fuzzy-matcher = "0.3"
log = "0.4"
anyhow = { workspace = true }
toml = { workspace = true }
once_cell = { workspace = true }
colored = { workspace = true }
streaming-iterator = "0.1"
shell-words = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
pretty_assertions = { workspace = true }