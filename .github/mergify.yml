# Mergify Configuration
# This file configures automatic merging of pull requests

pull_request_rules:
  # Auto-merge for Dependabot minor and patch updates
  - name: Automatic merge for Dependabot minor/patch updates
    conditions:
      - author=dependabot[bot]
      - check-success=check
      - check-success=fmt
      - check-success=clippy
      - check-success=test (ubuntu-latest, 1.88.0, )
      - check-success=test (ubuntu-latest, 1.88.0, --all-features)
      - check-success=test (windows-latest, 1.88.0, )
      - check-success=test (windows-latest, 1.88.0, --all-features)
      - check-success=test (macos-latest, 1.88.0, )
      - check-success=test (macos-latest, 1.88.0, --all-features)
      - -title~=(?i)\Wupdate\W.*\Wto\W.*\Wmajor
      - -draft
      - -conflict
    actions:
      merge:
        method: squash
        commit_message_template: |
          {{ title }} (#{{ number }})
          
          {{ body }}
          
          Co-authored-by: {{ author }}

  # Auto-merge PRs with automerge label and all checks passing
  - name: Automatic merge for labeled PRs
    conditions:
      - label=automerge
      - check-success=check
      - check-success=fmt
      - check-success=clippy
      - check-success=test (ubuntu-latest, 1.88.0, )
      - check-success=test (ubuntu-latest, 1.88.0, --all-features)
      - check-success=test (windows-latest, 1.88.0, )
      - check-success=test (windows-latest, 1.88.0, --all-features)
      - check-success=test (macos-latest, 1.88.0, )
      - check-success=test (macos-latest, 1.88.0, --all-features)
      - "#approved-reviews-by>=1"
      - -draft
      - -conflict
      - -label=do-not-merge
      - -label=work-in-progress
    actions:
      merge:
        method: squash
        commit_message_template: |
          {{ title }} (#{{ number }})
          
          {{ body }}
          
          Co-authored-by: {{ author }}
      delete_head_branch:
        force: false

  # Auto-merge documentation-only changes
  - name: Automatic merge for docs updates
    conditions:
      - label=documentation
      - check-success=check
      - check-success=fmt
      - files~=^(.*\.md|docs/.*|\.github/.*\.md|README\.md|CONTRIBUTING\.md)$
      - -files~=\.(rs|toml|lock)$
      - -draft
      - -conflict
      - -label=do-not-merge
    actions:
      merge:
        method: squash
        commit_message_template: |
          docs: {{ title }} (#{{ number }})
          
          {{ body }}
          
          Co-authored-by: {{ author }}

  # Add automerge label for my own PRs
  - name: Label my PRs for automerge
    conditions:
      - author=codeitlikemiley
      - check-success=check
      - check-success=fmt
      - check-success=clippy
      - -draft
      - -conflict
      - -label=do-not-merge
      - -label=work-in-progress
    actions:
      label:
        add:
          - automerge

  # Request reviews for major changes
  - name: Request review for major changes
    conditions:
      - -author=dependabot[bot]
      - -label=automerge
      - -label=dependencies
      - -draft
      - files~=\.(rs|toml)$
      - "#files>10"
    actions:
      request_reviews:
        users:
          - codeitlikemiley

  # Label PRs based on files changed
  - name: Label based on files changed
    conditions:
      - -draft
    actions:
      label:
        add:
          - dependencies
        remove: []
    conditions:
      - files~=Cargo\.(toml|lock)$

  - name: Label CI/CD changes
    conditions:
      - -draft
      - files~=\.github/workflows/.*
    actions:
      label:
        add:
          - ci/cd

  - name: Label documentation changes
    conditions:
      - -draft
      - files~=\.(md|MD)$|^docs/
    actions:
      label:
        add:
          - documentation

  # Update PR from base branch before merging
  - name: Update PR branch
    conditions:
      - -conflict
      - -draft
      - "#behind-by>=1"
      - label=automerge
    actions:
      update:
        method: merge