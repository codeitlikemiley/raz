[package]
name = "raz-cli"
version = "0.2.3"
edition = "2024"
description = "Universal command runner for Rust - Run any Rust file from anywhere with cursor-aware test targeting and override persistence"
license = "MIT"
authors = ["Uriah Galang <codeitlikemiley@gmail.com>"]
repository = "https://github.com/codeitlikemiley/raz"
homepage = "https://github.com/codeitlikemiley/raz"
documentation = "https://docs.rs/raz-cli"
readme = "README.md"
keywords = ["rust", "cargo", "testing", "cli", "runner"]
categories = ["command-line-utilities", "development-tools", "development-tools::testing"]
exclude = ["tests/fixtures/"]

[[bin]]
name = "raz"
path = "src/main.rs"

[dependencies]
raz-common = { path = "../../raz-common", version = "0.2.3" }
raz-core = { path = "../../raz-core", version = "0.2.3" }
raz-config = { path = "../../raz-config", version = "0.2.3" }
raz-override = { path = "../../raz-override", version = "0.2.3" }
clap = { workspace = true }
tokio = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
colored = { workspace = true }
shell-words = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
toml = { workspace = true }

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/raz-{ target }.tar.gz"
bin-dir = "{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides]
x86_64-pc-windows-msvc = { pkg-url = "{ repo }/releases/download/v{ version }/raz-win32-x64.tar.gz" }
x86_64-apple-darwin = { pkg-url = "{ repo }/releases/download/v{ version }/raz-darwin-x64.tar.gz" }
aarch64-apple-darwin = { pkg-url = "{ repo }/releases/download/v{ version }/raz-darwin-arm64.tar.gz" }
x86_64-unknown-linux-gnu = { pkg-url = "{ repo }/releases/download/v{ version }/raz-linux-x64.tar.gz" }
aarch64-unknown-linux-gnu = { pkg-url = "{ repo }/releases/download/v{ version }/raz-linux-arm64.tar.gz" }