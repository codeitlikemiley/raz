# RAZ Configuration - Web Development Template
# Optimized for Leptos, Dioxus, Yew and other web frameworks

# Core RAZ settings (optional - inherits from global config if not specified)
# [raz]
# version = "1.0"
# enabled_providers = ["cargo", "doc", "leptos", "dioxus"]
# cache_enabled = true
# cache_ttl_seconds = 300
# max_analysis_time_ms = 5000
# parallel_analysis = true

[providers.cargo]
enabled = true
priority = 100

[providers.leptos]
enabled = true
priority = 90

[providers.dioxus]
enabled = true
priority = 90

[providers.doc]
enabled = true
priority = 70

[filters]
max_commands = 15
smart_filtering = true
exclude_patterns = ["target/**", "node_modules/**", ".git/**", "dist/**", "public/**"]
include_only_rust = false

# Boost development server commands
[[filters.rules]]
name = "boost-dev-commands"
enabled = true

[[filters.rules.conditions]]
ProjectType = "leptos"

[[filters.rules.actions]]
BoostPriority = { pattern = "serve", boost = 20 }

[[filters.rules.actions]]
BoostPriority = { pattern = "watch", boost = 15 }

[ui]
max_commands = 15
group_by_category = true
show_descriptions = true
show_estimated_duration = true
compact_mode = false
theme = "default"