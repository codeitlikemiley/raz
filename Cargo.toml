[workspace]
members = [
    "raz-common",
    "raz-core",
    "raz-adapters/cli", 
    "raz-config",
    "raz-override",
    "raz-validation",
]
exclude = ["vscode"]
resolver = "2"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
tokio = { version = "1.0", features = ["full"] }
anyhow = "1.0"
thiserror = "2.0"
clap = { version = "4.0", features = ["derive"] }
tree-sitter = "0.25.6"
tree-sitter-rust = "0.24.0"
regex = "1.10"
indexmap = { version = "2.0", features = ["serde"] }
lru = "0.16.0"
notify = "8.1.0"
glob = "0.3"
tempfile = "3.8"
pretty_assertions = "1.4"
criterion = { version = "0.6", features = ["html_reports"] }
proptest = "1.4"
colored = "3.0.0"
once_cell = "1.19"
shell-words = "1.1"
chrono = { version = "0.4", features = ["serde"] }
fuzzy-matcher = "0.3"

# Validation system dependencies
raz-validation = { path = "raz-validation", version = "0.2.3" }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

[profile.dev]
opt-level = 0
debug = true
